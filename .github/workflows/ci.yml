name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # wabt provides wast2json for the spec testsuite.
      - run: sudo apt-get update && sudo apt-get install -y wabt

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: '3.14.2.0'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('wasm-ifc.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-cabal-

      - run: cabal update
      # Warnings are errors in CI (STYLE.md §9), not in local dev.
      - run: cabal build all --ghc-options=-Werror
      - run: cabal test all
